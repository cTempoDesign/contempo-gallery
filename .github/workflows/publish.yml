name: Publish

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC): no npm token stored anywhere

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish half-way

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # On master, every push publishes to npmjs.com. If package.json's version is newer than
      # the latest on npm it is used as-is (for minor/major bumps); otherwise the next patch
      # after the latest published version is used.
      - name: Publish to npm
        if: github.event_name == 'push'
        run: |
          NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          LATEST=$(npm view "$NAME" version 2>/dev/null || echo 0.0.0)
          NEWEST=$(printf '%s\n%s\n' "$LATEST" "$LOCAL" | sort -V | tail -n1)
          if [ "$LOCAL" = "$LATEST" ] || [ "$NEWEST" != "$LOCAL" ]; then
            npm version "$LATEST" --no-git-tag-version --allow-same-version
            npm version patch --no-git-tag-version
          fi
          echo "Publishing $NAME@$(node -p "require('./package.json').version") (latest on npm: $LATEST)"
          npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
          npm publish
